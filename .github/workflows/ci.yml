name: Rust CI and binaries
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: argus-center-linux-x64
            binary: target/release/argus-center
          - os: windows-latest
            artifact: argus-center-windows-x64
            binary: target/release/argus-center.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --locked
      - name: Compile release binary
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
